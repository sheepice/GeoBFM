[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "da2-vibe"
version = "0.1.0"
description = "DA2 visual post-training for SONIC/ViBe stairs, round stepping stones and three-point teleoperation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "psutil", "pyyaml"]

[project.scripts]
da2-vibe = "da2_vibe.cli:main"

[tool.setuptools.packages.find]
where = ["src", "training/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["assets: requires local resource profile and external checkpoints/data"]

[tool.ruff]
line-length = 110
exclude = ["third_party"]
[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
